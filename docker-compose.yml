services:
  windwise:
    build:
      context: .
      dockerfile: Dockerfile
    image: windwise:local
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      WINDWISE_STATIC_DIR: /app/backend/static
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
