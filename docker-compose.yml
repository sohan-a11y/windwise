services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: windwise:local
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      WINDWISE_STATIC_DIR: /app/backend/static
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  worker:
    image: windwise:local
    command: ["python", "-m", "celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info"]
    environment:
      REDIS_URL: redis://redis:6379/0
      WINDWISE_STATIC_DIR: /app/backend/static
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
